<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEP Apply</title>
<style>
  @font-face { font-family: 'Archivo'; src: local('Archivo'); }
  :root {
    --color-bg: #f3f2f2;
    --color-text: #201e1d;
    --color-divider: #201e1d;
    --color-neutral-600: #6b6866;
    --color-neutral-700: #4a4846;
    --color-accent: #1f7d72;
    --color-accent-100: #e3f1ef;
    --color-accent-600: #16645c;
    --color-accent-700: #0f4b45;
    --color-accent-800: #0a3733;
    --font-heading: 'Archivo', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, sans-serif;
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 40px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  a { color: var(--color-accent-700); text-decoration: underline; }
  a:hover { color: var(--color-accent-800); }
  .hr { border: none; border-top: 2px solid var(--color-divider); margin: 0; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-6); border-bottom: 2px solid var(--color-divider); flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 0.85rem; padding: 4px 10px; }
  .tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); font-family: var(--font-heading); font-weight: 700; white-space: nowrap; }
  .tag-neutral { background: #e5e3e2; color: #55524f; opacity: 0.55; white-space: nowrap; }
  .tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); opacity: 0.55; white-space: nowrap; }
  main { max-width: 840px; width: 100%; margin: 0 auto; padding: var(--space-8) var(--space-6); }
  h1 { font-family: var(--font-heading); font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; line-height: 1.05; margin: 0 0 var(--space-3) 0; }
  .eligibility-wrap { margin: var(--space-3) 0 var(--space-6) 0; }
  .eligibility { font-size: 1.05rem; line-height: 1.5; color: var(--color-neutral-700); max-width: 60ch; margin: var(--space-3) 0 var(--space-6) 0; }
  .section-label { font-family: var(--font-heading); text-transform: uppercase; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; color: var(--color-neutral-600); margin: var(--space-4) 0; }
  .state-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-4) 0; border-bottom: 2px solid var(--color-divider); flex-wrap: wrap; }
  .state-name { font-family: var(--font-heading); font-size: 1.2rem; font-weight: 700; }
  .btn-primary { background: var(--color-accent); color: var(--color-bg); font-family: var(--font-heading); font-weight: 700; padding: 10px 18px; text-decoration: none; white-space: nowrap; display: inline-block; }
  .btn-primary:hover { background: var(--color-accent-600); color: var(--color-bg); }
  .contact { font-size: 0.98rem; line-height: 1.7; color: var(--color-neutral-700); margin: 0; }
  footer { border-top: 2px solid var(--color-divider); padding: var(--space-4) var(--space-6); }
</style>
</head>
<body>
<div class="step-page">
  <nav class="nav">
    <span></span>
    <span class="tag tag-accent" id="batchTag">BATCH</span>
  </nav>
  <main>
    <div style="display:flex; align-items:center; gap:var(--space-4);">
      <img src="https://stepapply.com/step-icon.png" alt="STEP logo" style="height:72px; width:auto; display:block; flex-shrink:0;">
      <h1 id="heading" style="margin:0;">STEP Application Form</h1>
    </div>
    <p class="eligibility" id="eligibility"></p>
    <hr class="hr" style="margin:0 0 8px 0;">
    <p class="section-label">Select your state</p>
    <div id="states"></div>
    <hr class="hr" style="margin:40px 0 24px 0;">
    <p class="section-label">Contact us</p>
    <p class="contact">STEP Helpline: <a href="tel:+918939182320">+91-8939182320</a><br>Email: <a href="mailto:step@thoughtworks.com">step@thoughtworks.com</a></p>
  </main>
  <footer></footer>
</div>
<script src="data.js"></script>
<script>
  var d = window.STEP_DATA || { batch: '', eligibility: '', states: [] };
  document.getElementById('batchTag').textContent = 'BATCH \u00A0' + d.batch;
  document.getElementById('heading').innerHTML = 'STEP Batch ' + d.batch + '<br>Application Form';
  document.getElementById('eligibility').textContent = d.eligibility;
  var container = document.getElementById('states');
  (d.states || []).forEach(function (s) {
    var row = document.createElement('div');
    row.className = 'state-row';
    var name = document.createElement('span');
    name.className = 'state-name';
    name.textContent = s.name;
    row.appendChild(name);
    if (s.url && s.open !== false) {
      var a = document.createElement('a');
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
      a.className = 'btn-primary'; a.textContent = 'Apply now';
      row.appendChild(a);
    } else if (s.url && s.open === false) {
      var closed = document.createElement('span');
      closed.className = 'tag tag-neutral'; closed.textContent = 'Closed';
      row.appendChild(closed);
    } else {
      var soon = document.createElement('span');
      soon.className = 'tag tag-outline'; soon.textContent = 'Coming soon';
      row.appendChild(soon);
    }
    container.appendChild(row);
  });
</script>
</body>
</html>
